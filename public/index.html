<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F0" />

    <!-- Theme before first paint — reads the user's explicit choice from
         localStorage (cvp_theme) and stamps <html data-theme="..."> so the
         CSS tokens resolve correctly from the very first frame (no flash of
         wrong theme). prefers-color-scheme is intentionally ignored: the
         default wins unless the user explicitly toggled.
         Keep the fallback in sync with DEFAULT_THEME in src/lib/theme.js. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('cvp_theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!-- Google Search Console -->
    <meta name="google-site-verification" content="3e3d8f1b596b45d0" />

    <!-- Preconnects for third-party origins used site-wide -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://evihcqpvoorsdmzjnvjz.supabase.co" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://eu.i.posthog.com" />

    <!-- DM Sans — used by the candidate dashboard (Candidate Dashboard v2).
         The CSS is fetched once; the font files load lazily only when a
         DM Sans element actually renders, so other routes pay nothing. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
    <!-- Plus Jakarta Sans — the admin command center typeface. Lazy-loaded
         like the above; only the /admin route renders it. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- SEO — title/description are neutral DEFAULTS only. Page-specific
         tags (canonical, og:*) live in each route's <Helmet>: react-helmet-
         async ADDS tags but never removes static ones, so a static canonical
         here would ship on every route and tell Google the whole site is a
         duplicate of the homepage (the bug that deindexed the blog). Do not
         re-add canonical or og:url to this file. -->
    <title>CVPassport — Build ATS-Friendly Resumes for UAE & Gulf Jobs</title>
    <meta name="description" content="Build ATS-optimised resumes for UAE, Saudi Arabia and GCC job markets. Free templates, ATS score checker, and Walk-In CV builder for Gulf job seekers." />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
